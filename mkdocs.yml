site_name: Agentic AI, Live
site_description: >-
  OpenSlava 2026 hands-on lab — Agentic AI, Live: Orchestrating Agents with Real-Time
  Data. Build an event-driven AI pipeline with Confluent Cloud, Flink SQL and IBM
  watsonx Orchestrate, using IBM Bob as your pair programmer.
site_author: Ivor Rothwell, IBM
site_url: https://irpk026.github.io/docs-advanced/
docs_dir: docs
site_dir: site
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  logo: assets/BWS_Advanced.png
  favicon: assets/BWS_Advanced.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Setup: setup/index.md
  - The Lab: lab/index.md
  - Stretch Exercises: lab/exercises.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/openslava.css

extra_javascript:
  - javascripts/progress.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/juseljuk/bobchestrate-workshop
      name: Workshop repository

copyright: Openslava 2026 — watsonx Orchestrate advanced lab
